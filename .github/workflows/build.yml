name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Test HabitCore
        run: swift test --package-path Packages/HabitCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild -project Habits.xcodeproj -scheme Habits -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Fake-sign with entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Habits.app
          ROOT="$PWD"
          echo "--- entitlements file ---"; cat "$ROOT/Config/Habits.entitlements"
          echo "--- before signing ---"; ldid -e "$APP/Habits" || true
          # Sign the extension first, then the app.
          ldid -S"$ROOT/Config/HabitsWidgets.entitlements" "$APP/PlugIns/HabitsWidgets.appex/HabitsWidgets"
          ldid -S"$ROOT/Config/Habits.entitlements" "$APP/Habits"
          echo "--- app after signing (ldid -e) ---"; ldid -e "$APP/Habits"
          echo "--- appex after signing (ldid -e) ---"; ldid -e "$APP/PlugIns/HabitsWidgets.appex/HabitsWidgets"
          echo "--- codesign view ---"; codesign -d --entitlements - "$APP" 2>&1 || true
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Habits.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Habits-ipa
          path: Habits.ipa

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Habits.ipa
