name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Test HabitCore
        run: swift test --package-path Packages/HabitCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild -project Habits.xcodeproj -scheme Habits -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Fake-sign with entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Habits.app
          ROOT="$PWD"
          # Sign the extension first, then the app.
          ldid -S"$ROOT/Config/HabitsWidgets.entitlements" "$APP/PlugIns/HabitsWidgets.appex/HabitsWidgets"
          ldid -S"$ROOT/Config/Habits.entitlements" "$APP/Habits"
          echo "--- app entitlements ---"; ldid -e "$APP/Habits"
          echo "--- widgets entitlements ---"; ldid -e "$APP/PlugIns/HabitsWidgets.appex/HabitsWidgets"
          # Fail the build if the app group did not make it into the signatures.
          ldid -e "$APP/Habits" | grep -q "group.com.ghazaly.habits"
          ldid -e "$APP/PlugIns/HabitsWidgets.appex/HabitsWidgets" | grep -q "group.com.ghazaly.habits"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Habits.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Habits-ipa
          path: Habits.ipa

      - name: Attach IPA to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Habits.ipa

      # Every green build on main becomes a Release the phone can download directly
      # (no zip, no PC), plus an AltStore source that always points at the newest one.
      - name: Publish build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Habits.ipa
          make_latest: true

      - name: Write AltStore source
        if: github.ref == 'refs/heads/main'
        run: |
          REPO="${{ github.repository }}"
          BUILD="${{ github.run_number }}"
          SIZE=$(stat -f%z Habits.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/$REPO/releases/download/build-$BUILD/Habits.ipa"
          cat > source.json <<EOF
          {
            "name": "عاداتي",
            "identifier": "com.ghazaly.habits.source",
            "subtitle": "تطبيق عاداتي الشخصي",
            "apps": [
              {
                "name": "عاداتي",
                "bundleIdentifier": "com.ghazaly.habits",
                "developerName": "Ghazaly",
                "subtitle": "ابنِ عاداتك",
                "localizedDescription": "تطبيق عاداتي: مهمات، تنبيهات، إنجازات وصفحات خاصة.",
                "iconURL": "https://github.com/ghazaly-wq.png",
                "tintColor": "12A96A",
                "version": "0.1.0",
                "versionDate": "$DATE",
                "downloadURL": "$URL",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "0.1.0",
                    "buildVersion": "$BUILD",
                    "date": "$DATE",
                    "downloadURL": "$URL",
                    "size": $SIZE,
                    "minOSVersion": "26.1"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          python3 -c "import json;json.load(open('source.json'))"

      - name: Publish AltStore source
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: altstore-source
          name: AltStore source
          body: Add this link in AltStore → Sources → "+" (releases/download/altstore-source/source.json).
          files: source.json
          make_latest: false
