name: Habits
options:
  bundleIdPrefix: com.ghazaly
  developmentLanguage: ar
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ar
packages:
  HabitCore:
    path: Packages/HabitCore
targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: HabitCore
      - target: HabitsWidgets
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Habits
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: نستخدم موقعك مرة واحدة لحساب أوقات الصلاة
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.ghazaly.habits.refresh]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ghazaly.habits
            CFBundleURLSchemes: [habits]
    entitlements:
      path: Config/Habits.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghazaly.habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazaly.habits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  HabitsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Habits
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/HabitsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghazaly.habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazaly.habits.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
